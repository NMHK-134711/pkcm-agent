[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkcm-agent"
version = "0.0.1"
description = "Pokemon Champions battle simulator and agent"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
rl = ["pettingzoo>=1.24", "gymnasium>=0.29"]
# torch is not pinned to a CUDA build here: the right wheel depends on the
# machine's driver, and pip's default index serves the CPU one. For a GPU:
#   pip install --index-url https://download.pytorch.org/whl/cu124 torch
train = ["torch>=2.4", "wandb>=0.17"]
dev = ["pytest>=8.0"]
# Reading the game's own screen, for scripts/coach.py. The OCR is Windows' own
# and needs nothing installed; these two are the capture half.
screen = ["Pillow>=10.0", "mss>=9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
