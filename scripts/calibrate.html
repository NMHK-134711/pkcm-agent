<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>코치 화면 보정</title>
<style>
  :root { --bg:#10131a; --panel:#191d27; --line:#2a3040; --ink:#e7ebf3;
          --dim:#8d97ab; --us:#6ea8fe; --good:#6ee7a8; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif; }
  .wrap { max-width:1400px; margin:0 auto; padding:14px; }
  header { display:flex; gap:12px; align-items:center; flex-wrap:wrap;
           padding-bottom:10px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; font-weight:600; }
  button, input, select { font:inherit; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:8px; padding:7px 11px; }
  button { cursor:pointer; } button:hover { border-color:var(--us); }
  .muted { color:var(--dim); font-size:12px; }
  .cols { display:grid; grid-template-columns:1fr 330px; gap:14px; margin-top:12px; }
  .stage { position:relative; background:#000; border:1px solid var(--line);
           border-radius:10px; overflow:hidden; user-select:none; }
  .stage img { display:block; width:100%; }
  .box { position:absolute; border:2px solid var(--us); background:rgba(110,168,254,.16);
         pointer-events:none; }
  .box.live { border-style:dashed; }
  .box b { position:absolute; top:-19px; left:-2px; font-size:11px; font-weight:600;
           background:var(--us); color:#0b1020; padding:0 5px; border-radius:4px;
           white-space:nowrap; }
  .side { display:grid; gap:9px; align-content:start; }
  .item { background:var(--panel); border:1px solid var(--line); border-radius:10px;
          padding:9px 11px; }
  .item.active { border-color:var(--us); }
  .item .name { font-size:12.5px; font-weight:600; }
  .item .why { font-size:11px; color:var(--dim); }
  .item .got { font-size:12px; margin-top:5px; color:var(--good);
               word-break:break-all; white-space:pre-wrap; }
  .item .got.none { color:var(--dim); }
  .err { color:var(--bad); font-size:12.5px; margin-top:8px; }
  .ok { color:var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>코치 화면 보정</h1>
    <select id="window"></select>
    <button id="refresh">지금 캡처</button>
    <button id="delayed">3초 뒤 캡처 (게임 창을 앞으로)</button>
    <span style="flex:1"></span>
    <button id="save">저장</button>
  </header>
  <div class="muted" style="margin-top:8px">
    캡처는 <b>화면</b>을 읽습니다 — 게임을 가리는 창이 있으면 그게 찍힙니다.
    <b>3초 뒤 캡처</b>를 누르고 게임 창을 클릭해서 앞으로 가져오세요.
    찍힌 그림이 게임 화면이 맞는지 눈으로 확인한 다음,
    오른쪽에서 항목을 고르고 그림 위에 네모를 <b>드래그</b>하세요.
    네모는 <b>찍힌 그림에서 그대로 잘라서</b> 읽으므로, 읽는 동안 브라우저가
    앞에 있어도 상관없습니다. 배틀 중 화면에서 하는 게 좋습니다.
  </div>
  <div class="cols">
    <div class="stage" id="stage"><img id="shot" alt=""></div>
    <div class="side" id="side"></div>
  </div>
  <div id="msg"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let S = {};                 // last /shot payload
let boxes = {};             // name -> {left,top,right,bottom} in 0..1
let current = null;         // which region is being drawn
let sampled = {};           // name -> what reading it back gave
let sizes = {};             // name -> the crop's pixel size, which explains a bad read
let drag = null;

async function get(path) { return (await fetch(path)).json(); }

function draw() {
  const stage = $("stage");
  [...stage.querySelectorAll(".box")].forEach(b => b.remove());
  const w = stage.clientWidth, h = $("shot").clientHeight;
  const add = (name, box, live) => {
    const el = document.createElement("div");
    el.className = "box" + (live ? " live" : "");
    el.style.left = (box.left * w) + "px";
    el.style.top = (box.top * h) + "px";
    el.style.width = ((box.right - box.left) * w) + "px";
    el.style.height = ((box.bottom - box.top) * h) + "px";
    el.innerHTML = `<b>${name}</b>`;
    stage.appendChild(el);
  };
  for (const [name, box] of Object.entries(boxes)) add(name, box, false);
  if (drag) add(current || "", drag, true);

  $("side").innerHTML = Object.entries(S.wanted || {}).map(([name, why]) => {
    const has = boxes[name];
    const got = sampled[name];
    return `<div class="item ${current === name ? "active" : ""}" data-name="${name}">
      <div class="name">${name}${has ? "" : " <span class='why'>— 아직 없음</span>"}</div>
      <div class="why">${why}</div>
      ${got === undefined ? "" :
        `<div class="got ${got === null || got === "" ? "none" : ""}">읽음: ${
          got === null || got === "" ? "(아무것도 못 읽음)" : got}${
          sizes[name] ? ` <span class="why">(${sizes[name]}px)</span>` : ""}</div>`}
    </div>`;
  }).join("");
  $("side").querySelectorAll(".item").forEach(el => {
    el.onclick = () => { current = el.dataset.name; draw(); };
  });
}

function stagePoint(event) {
  const rect = $("shot").getBoundingClientRect();
  return {
    x: Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width)),
    y: Math.min(1, Math.max(0, (event.clientY - rect.top) / rect.height)),
  };
}

$("stage").onmousedown = (e) => {
  if (!current) { note("오른쪽에서 항목을 먼저 고르세요", true); return; }
  const p = stagePoint(e);
  drag = {left: p.x, top: p.y, right: p.x, bottom: p.y, ax: p.x, ay: p.y};
  draw();
};
window.onmousemove = (e) => {
  if (!drag) return;
  const p = stagePoint(e);
  drag.left = Math.min(drag.ax, p.x); drag.right = Math.max(drag.ax, p.x);
  drag.top = Math.min(drag.ay, p.y); drag.bottom = Math.max(drag.ay, p.y);
  draw();
};
window.onmouseup = async () => {
  if (!drag) return;
  const box = {left: drag.left, top: drag.top, right: drag.right, bottom: drag.bottom};
  drag = null;
  if (box.right - box.left < 0.002 || box.bottom - box.top < 0.002) { draw(); return; }
  boxes[current] = box;
  draw();
  // Read it back immediately: finding out three turns into a real game that
  // the rectangle was two pixels short is the failure this prevents.
  const name = current;
  const got = await get(`/sample?name=${encodeURIComponent(name)}&`
    + `left=${box.left}&top=${box.top}&right=${box.right}&bottom=${box.bottom}`);
  sampled[name] = got.error ? got.error : got.value;
  sizes[name] = got.size || "";
  if (got.error) note(got.error, true); else note("");
  draw();
};

function note(text, bad) {
  $("msg").innerHTML = text ? `<div class="${bad ? "err" : "ok"}">${text}</div>` : "";
}

async function shoot(delay) {
  const chosen = $("window").value;
  if (delay) note(`${delay}초 뒤에 찍습니다 — 지금 게임 창을 클릭하세요…`);
  const got = await get("/shot?delay=" + (delay || 0)
    + "&window=" + encodeURIComponent(chosen ?? ""));
  if (got.error) { note(got.error, true); return; }
  S = got;
  $("shot").src = got.image;
  if (!Object.keys(boxes).length) boxes = JSON.parse(JSON.stringify(got.regions || {}));
  $("shot").onload = draw;
  note("");
  draw();
}

$("refresh").onclick = () => shoot(0);
$("delayed").onclick = () => shoot(3);
$("save").onclick = async () => {
  const missing = Object.keys(S.wanted).filter(n => !boxes[n]);
  const got = await get("/save?window=" + encodeURIComponent($("window").value)
    + "&regions=" + encodeURIComponent(JSON.stringify(boxes)));
  if (got.error) { note(got.error, true); return; }
  note(`저장됨: ${got.saved}`
    + (missing.length ? ` — 아직 안 그린 것: ${missing.join(", ")}` : " — 전부 그렸습니다"),
    missing.length > 0);
};

(async () => {
  const list = await get("/windows");
  const titles = (list.windows || []).filter(t => t.trim());
  $("window").innerHTML = titles.map(t =>
    `<option value="${t}">${t}</option>`).join("")
    + `<option value="">(전체 화면)</option>`;
  const guess = titles.find(t => /bluestacks|ldplayer|nox|mumu|champions/i.test(t));
  if (guess) $("window").value = guess;
  await shoot(0);
})();
</script>
</body>
</html>
